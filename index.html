<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    background: #000;
    overflow-x: hidden;
  }

  .block {
    width: 100%;
    display: block;
    line-height: 0;
  }

  .block img {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>

<div class="block"><img src="photos/1.png" alt=""></div>
<div class="block"><img src="photos/2.png" alt=""></div>
<div class="block"><img src="photos/3.png" alt=""></div>
<div class="block"><img src="photos/4.png" alt=""></div>
<div class="block"><img src="photos/5.png" alt=""></div>

</body>
</html>
